<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>
    Wie beim Laptop: auf das Seitenverhaeltnis des Rahmens zuschneiden und in
    doppelter Groesse mitliefern. Ohne den Zuschnitt muss object-fit strecken,
    ohne die doppelte Fassung ist es auf einem feinen Bildschirm zu wenig.
</f:comment>
<f:if condition="{reference.screenshotSmartphone}">
    <f:variable name="hoehe1x" value="{width * 2.11111}" />
    <f:variable name="breite2x" value="{width * 2}" />
    <f:variable name="hoehe2x" value="{width * 2.11111 * 2}" />

    <div class="device-showcase__screen device-showcase__phone">
        <div class="device-showcase__phone-notch"></div>
        <div class="device-showcase__inner">
            <img src="{f:uri.image(image: reference.screenshotSmartphone, width: width, height: '{hoehe1x}c')}"
                 srcset="{f:uri.image(image: reference.screenshotSmartphone, width: width, height: '{hoehe1x}c')} 1x, {f:uri.image(image: reference.screenshotSmartphone, width: breite2x, height: '{hoehe2x}c')} 2x"
                 width="{width}" height="{hoehe1x -> f:format.number(decimals: 0, thousandsSeparator: '')}"
                 alt="{reference.name}" loading="{loading}" decoding="async" />
        </div>
    </div>
</f:if>

</html>
