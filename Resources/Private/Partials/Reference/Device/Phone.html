<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{reference.screenshotSmartphone}">
    <div class="device-showcase__screen device-showcase__phone">
        <div class="device-showcase__phone-notch"></div>
        <div class="device-showcase__inner">
            <f:image image="{reference.screenshotSmartphone}" width="{width}" alt="{reference.name}" loading="{loading}" />
        </div>
    </div>
</f:if>

</html>
