<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="content">

    <f:asset.script identifier="filter" src="EXT:references/Resources/Public/JavaScript/filter.js" />

    <f:flashMessages/>

    <div class="references__tagFilter">
    <div class="references__tagFilter">
        <label for="technology-select">Verwendete Technik:</label>

        <f:for each="{technologyTags}" as="technologyTag">
            <input type="checkbox" class="btn-check" id="reference-{technologyTag.uid}" data-technology-tag="{technologyTag.uid}" autocomplete="off">&nbsp;
            <label class="btn btn-primary" for="reference-{technologyTag.uid}">{technologyTag.title}</label>
        </f:for>
    </div>
    <hr>
    <div class="references__tagFilter">
        <label for="industry-select">Branche:</label>

        <f:for each="{industryTags}" as="industryTag">
            <input type="checkbox" class="btn-check" id="reference-{industryTag.uid}" data-industry-tag="{industryTag.uid}" autocomplete="off">&nbsp;
            <label class="btn btn-primary" for="reference-{industryTag.uid}">{industryTag.title}</label>
        </f:for>
    </div>
    <hr>
    <div class="references__tagFilter">
        <label for="targetGroup-select">Zielgruppe:</label>

        <f:for each="{targetGroupTags}" as="targetGroupTag">
            <input type="checkbox" class="btn-check" id="reference-{targetGroupTag.uid}" data-targetGroup-tag="{targetGroupTag.uid}" autocomplete="off">&nbsp;
            <label class="btn btn-primary" for="industry-{targetGroupTag.uid}">{targetGroupTag.title}</label>
        </f:for>
    </div>


    <hr>

    <f:for each="{references}" as="reference">
        <div class="references__item"
             data-technology-tags="{reference.technologyTags -> f:format.json()}"
             data-industry-tags="{reference.industryTags -> f:format.json()}"
             data-targetgroup-tags="{reference.targetGroupTags -> f:format.json()}">
            <f:render partial="Reference" arguments="{reference: reference}"/>
        </div>
    </f:for>

</f:section>
</html>
